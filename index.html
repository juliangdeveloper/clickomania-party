<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clickomania Party</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--panel:#1a1a2e;--panel2:#16213e;--accent:#e94560;--text:#e8e8e8;--dim:#888;--cell-empty:#1e2a3a;--cell-border:#2c3e50}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh;padding:16px}.screen.active{display:flex;flex-direction:column;align-items:center}
#menu{justify-content:center;text-align:center}
#menu h1{font-size:2.6em;margin-bottom:4px;background:linear-gradient(135deg,#e74c3c,#3498db,#2ecc71,#f1c40f,#9b59b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#menu .sub{color:var(--dim);margin-bottom:20px;font-size:.95em}
.ms{background:var(--panel);border-radius:16px;padding:16px;margin:8px 0;max-width:500px;width:100%}
.ms h3{color:var(--accent);margin-bottom:10px;font-size:.95em}
.pr{display:flex;align-items:center;gap:6px;margin:5px 0;padding:7px;background:rgba(255,255,255,.04);border-radius:8px}
.pr label{min-width:40px;font-weight:700;font-size:.9em}
.pr input[type=text]{flex:1;padding:5px 8px;border-radius:6px;border:1px solid #333;background:#0d1b2a;color:#fff;min-width:0;font-size:.9em}
.pr select{padding:5px;border-radius:6px;border:1px solid #333;background:#0d1b2a;color:#fff;font-size:.85em}
.btn{padding:10px 28px;border:none;border-radius:10px;font-size:1em;font-weight:700;cursor:pointer;transition:all .2s}
.btn-p{background:linear-gradient(135deg,var(--accent),#d93a7a);color:#fff}
.btn-p:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(233,69,96,.4)}
.btn-s{background:#333;color:#fff}.btn-s:hover{background:#444}
.btn-sm{padding:6px 14px;font-size:.8em}
.bg{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.cbtn{width:42px;height:42px;border-radius:50%;border:2px solid #444;background:transparent;color:#fff;font-size:1.1em;cursor:pointer;transition:all .2s}
.cbtn.on{border-color:var(--accent);background:var(--accent)}
.pcb{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.pcb label{font-size:.85em;color:var(--dim);cursor:pointer;padding:4px 10px;border-radius:8px;border:2px solid #333;transition:all .2s}
.pcb label:has(input:checked){border-color:var(--accent);background:rgba(233,69,96,.15)}
.pcb input{display:none}

#game{padding:8px;width:100%}
.g-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;padding:0 4px;margin-bottom:6px}
.round-badge{background:var(--panel2);padding:6px 14px;border-radius:12px;font-weight:700;font-size:1em}
.turn-badge{padding:6px 16px;border-radius:10px;font-weight:700;font-size:1em;transition:all .3s}

.board-wrap{display:flex;justify-content:center;margin:8px 0;overflow-x:auto}
.board{display:grid;gap:1px;background:var(--cell-border);border-radius:8px;padding:2px;touch-action:manipulation}
.cell{width:32px;height:32px;border-radius:4px;cursor:pointer;transition:all .15s;position:relative;display:flex;align-items:center;justify-content:center}
.cell:hover{filter:brightness(1.3);transform:scale(1.08);z-index:2}
.cell.empty{background:var(--cell-empty);cursor:default;pointer-events:none}
.cell.highlight{box-shadow:0 0 8px 2px rgba(255,255,255,.6);transform:scale(1.1);z-index:3}
.cell.popping{animation:popAnim .25s ease-out forwards}
@keyframes popAnim{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.8}100%{transform:scale(0);opacity:0}}
.cell.falling{transition:transform .15s ease-in}
.cell.cascade-pop{animation:cascadePop .3s ease-out}
@keyframes cascadePop{0%{filter:brightness(1)}50%{filter:brightness(2)}100%{filter:brightness(1)}}

.player-bar{display:flex;gap:8px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.pb{padding:6px 14px;border-radius:10px;font-weight:700;font-size:.85em;border:2px solid transparent;transition:all .3s;opacity:.5}
.pb.current{opacity:1;transform:scale(1.1);box-shadow:0 0 12px rgba(255,255,255,.15)}
.pb .pb-score{margin-left:6px;font-size:.95em}

.score-pop{position:fixed;pointer-events:none;font-size:1.5em;font-weight:900;z-index:100;text-shadow:0 2px 8px rgba(0,0,0,.8);animation:popUp .8s ease-out forwards}
@keyframes popUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(1.4)}}
.cascade-label{position:fixed;pointer-events:none;font-size:1.2em;font-weight:700;z-index:100;color:#f1c40f;text-shadow:0 2px 8px rgba(0,0,0,.8);animation:popUp .6s ease-out forwards}

.msg{background:rgba(233,69,96,.12);border:1px solid var(--accent);border-radius:10px;padding:8px 16px;text-align:center;font-weight:600;font-size:.9em;margin-top:8px;max-width:700px;width:100%}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.overlay-card{background:var(--panel);border-radius:20px;padding:24px;max-width:500px;width:100%;text-align:center;border:2px solid var(--accent);max-height:85vh;overflow-y:auto}
.overlay-card h2{font-size:1.2em;margin-bottom:8px}
.overlay-card p{margin:8px 0;line-height:1.5;font-size:.9em}
.overlay-card .paper-box{background:var(--panel2);border-radius:12px;padding:14px;margin:10px 0;text-align:left;font-size:.85em;line-height:1.6;border-left:3px solid var(--accent)}
.overlay-card .theorem{background:rgba(233,69,96,.1);border-left:3px solid var(--accent);padding:10px;margin:8px 0;font-size:.85em;border-radius:0 8px 8px 0;font-style:italic}

.overlay-card .setting-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.85em}
.overlay-card select,.overlay-card input[type=number]{padding:4px 8px;border-radius:6px;border:1px solid #333;background:#0d1b2a;color:#fff;font-size:.85em;width:80px}

#end{text-align:center;padding-top:20px}
#end h1{font-size:2.2em;margin-bottom:8px;background:linear-gradient(135deg,#e74c3c,#3498db,#2ecc71);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.end-rank{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-radius:12px;margin:5px 0;max-width:450px}
.end-rank.w{border:2px solid #f5a623}
.er-pos{font-size:1.4em;width:36px}
.er-name{flex:1;text-align:left;font-weight:600}
.er-score{font-weight:700;color:var(--accent)}
</style>
</head>
<body>

<div id="menu" class="screen active">
  <h1>💥 Clickomania Party</h1>
  <p class="sub">Clicka grupos · Cascadas · ¡Compite!</p>
  <div class="ms">
    <h3>Jugadores</h3>
    <div class="pcb"><button class="cbtn on" onclick="setPC(2)">2</button><button class="cbtn" onclick="setPC(3)">3</button><button class="cbtn" onclick="setPC(4)">4</button></div>
    <div id="pSetup"></div>
  </div>
  <div class="ms">
    <h3>Rondas</h3>
    <div class="pcb">
      <label><input type="radio" name="rnd" value="2"> 2</label>
      <label><input type="radio" name="rnd" value="3" checked> 3</label>
      <label><input type="radio" name="rnd" value="5"> 5</label>
    </div>
  </div>
  <div class="ms">
    <h3>Tablero</h3>
    <div class="pcb">
      <label><input type="radio" name="bsz" value="small"> Pequeño (10×8)</label>
      <label><input type="radio" name="bsz" value="med" checked> Mediano (15×12)</label>
      <label><input type="radio" name="bsz" value="big"> Grande (18×14)</label>
    </div>
  </div>
  <div class="bg">
    <button class="btn btn-p" onclick="startG()">🎲 Jugar</button>
    <button class="btn btn-s" onclick="showAbout()">📄 El Paper</button>
    <button class="btn btn-s" onclick="showRules()">📜 Reglas</button>
  </div>
</div>

<div id="game" class="screen">
  <div class="g-top">
    <div class="round-badge" id="roundBadge">Ronda 1</div>
    <div class="turn-badge" id="turnBadge">Turno</div>
    <div style="display:flex;gap:4px">
      <button class="btn btn-s btn-sm" onclick="showAbout()">📄</button>
      <button class="btn btn-s btn-sm" onclick="showRules()">📜</button>
    </div>
  </div>
  <div class="player-bar" id="playerBar"></div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="msg" id="msg">Preparando...</div>
</div>

<div id="end" class="screen">
  <h1>🏆 ¡Fin del Juego!</h1>
  <div id="endRank"></div>
  <div class="bg">
    <button class="btn btn-p" onclick="showS('menu')">🏠 Menú</button>
    <button class="btn btn-s" onclick="startG()">🔄 Revancha</button>
  </div>
</div>

<div class="overlay" id="rulesOv"><div class="overlay-card" id="rulesCard"></div></div>
<div class="overlay" id="aboutOv"><div class="overlay-card" id="aboutCard"></div></div>

<script src="meta.js?v=1.0.6"></script>
<script src="progress.js?v=1.0.6"></script>
<script>
const PALETTE=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6'];
const PCOL=['#2dd4bf','#f97316','#ec4899','#84cc16'];
const MIN_GROUP=2;
const CASCADE_MIN_GROUP=4;
const BOARD_CLEAR_BONUS=100;

let G={grid:[],rows:12,cols:15,players:[],curP:0,round:0,maxRounds:3,animating:false,over:false,effectiveCols:15};

function setPC(n){document.querySelectorAll('#menu .cbtn').forEach((b,i)=>b.classList.toggle('on',i===n-2));renderPS(n)}
function renderPS(n){let h='';for(let i=0;i<n;i++)h+=`<div class="pr"><label style="color:${PCOL[i]}">P${i+1}</label><input type="text" id="pn${i}" placeholder="Jugador ${i+1}" maxlength="10"><select id="pt${i}"><option value="human">Humano</option><option value="easy">IA Fácil</option><option value="medium">IA Media</option><option value="hard">IA Difícil</option></select></div>`;document.getElementById('pSetup').innerHTML=h}
function getPC(){const a=document.querySelector('#menu .cbtn.on');return a?parseInt(a.textContent):2}
function getDur(){return parseInt(document.querySelector('input[name=rnd]:checked')?.value||3)}
function getBoardSize(){const v=document.querySelector('input[name=bsz]:checked')?.value||'med';return v==='small'?{c:10,r:8}:v==='big'?{c:18,r:14}:{c:15,r:12}}

function startG(){
  const n=getPC();const bs=getBoardSize();
  G.cols=bs.c;G.rows=bs.r;G.maxRounds=getDur();G.round=0;G.over=false;G.animating=false;
  G.players=[];
  for(let i=0;i<n;i++){
    const nm=document.getElementById(`pn${i}`)?.value.trim()||`Jugador ${i+1}`;
    const tp=document.getElementById(`pt${i}`)?.value||'human';
    G.players.push({name:nm,type:tp,color:PCOL[i],score:0,clears:0,maxTurn:0});
  }
  nextRound();showS('game');
}

function nextRound(){
  if(G.round>=1&&typeof recordRound==='function')recordRound();
  G.round++;
  if(G.round>G.maxRounds){endGame();return}
  generateBoard();
  G.curP=0;
  renderAll();
  startTurn();
}

function generateBoard(){
  G.grid=[];G.effectiveCols=G.cols;
  for(let r=0;r<G.rows;r++){
    G.grid[r]=[];
    for(let c=0;c<G.cols;c++){
      G.grid[r][c]=Math.floor(Math.random()*5)+1;
    }
  }
}

function findGroup(r,c){
  const color=G.grid[r][c];
  if(!color)return[];
  const visited=new Set();
  const group=[];
  const stack=[[r,c]];
  while(stack.length){
    const[cr,cc]=stack.pop();
    const key=cr*100+cc;
    if(visited.has(key))continue;
    if(cr<0||cr>=G.rows||cc<0||cc>=G.effectiveCols)continue;
    if(G.grid[cr][cc]!==color)continue;
    visited.add(key);
    group.push([cr,cc]);
    stack.push([cr-1,cc],[cr+1,cc],[cr,cc-1],[cr,cc+1]);
  }
  return group;
}

function findAllGroups(minSize){
  const ms=minSize||MIN_GROUP;
  const visited=new Set();
  const groups=[];
  for(let r=0;r<G.rows;r++){
    for(let c=0;c<G.effectiveCols;c++){
      if(!G.grid[r][c])continue;
      const key=r*100+c;
      if(visited.has(key))continue;
      const g=findGroup(r,c);
      g.forEach(([gr,gc])=>visited.add(gr*100+gc));
      if(g.length>=ms)groups.push(g);
    }
  }
  return groups;
}

function applyGravity(){
  for(let c=0;c<G.effectiveCols;c++){
    const tiles=[];
    for(let r=G.rows-1;r>=0;r--){if(G.grid[r][c])tiles.push(G.grid[r][c])}
    for(let r=0;r<G.rows;r++)G.grid[r][c]=0;
    for(let i=0;i<tiles.length;i++)G.grid[G.rows-1-i][c]=tiles[i];
  }
}

function collapseColumns(){
  const active=[];
  for(let c=0;c<G.effectiveCols;c++){
    let empty=true;
    for(let r=0;r<G.rows;r++){if(G.grid[r][c]){empty=false;break}}
    if(!empty)active.push(c);
  }
  const newGrid=[];
  for(let r=0;r<G.rows;r++){
    newGrid[r]=[];
    for(let nc=0;nc<active.length;nc++)newGrid[r][nc]=G.grid[r][active[nc]];
    for(let nc=active.length;nc<G.effectiveCols;nc++)newGrid[r][nc]=0;
  }
  G.grid=newGrid;
  G.effectiveCols=active.length;
}

function applyGravityTracked(trackGrid){
  for(let c=0;c<G.effectiveCols;c++){
    const tiles=[];const tracks=[];
    for(let r=G.rows-1;r>=0;r--){if(G.grid[r][c]){tiles.push(G.grid[r][c]);tracks.push(trackGrid[r][c])}}
    for(let r=0;r<G.rows;r++){G.grid[r][c]=0;trackGrid[r][c]=-1}
    for(let i=0;i<tiles.length;i++){G.grid[G.rows-1-i][c]=tiles[i];trackGrid[G.rows-1-i][c]=tracks[i]}
  }
}
function collapseColumnsTracked(trackGrid){
  const active=[];
  for(let c=0;c<G.effectiveCols;c++){let empty=true;for(let r=0;r<G.rows;r++){if(G.grid[r][c]){empty=false;break}};if(!empty)active.push(c)}
  const newGrid=[];const newTrack=[];
  for(let r=0;r<G.rows;r++){
    newGrid[r]=[];newTrack[r]=[];
    for(let nc=0;nc<active.length;nc++){newGrid[r][nc]=G.grid[r][active[nc]];newTrack[r][nc]=trackGrid[r][active[nc]]}
    for(let nc=active.length;nc<G.effectiveCols;nc++){newGrid[r][nc]=0;newTrack[r][nc]=-1}
  }
  G.grid=newGrid;
  for(let r=0;r<G.rows;r++)for(let c=0;c<G.effectiveCols;c++)trackGrid[r][c]=newTrack[r][c];
  G.effectiveCols=active.length;
}
function isNewGroup(group,trackGrid){
  const origCols=new Set();
  for(const[r,c]of group){const o=trackGrid[r][c];if(o>=0)origCols.add(o)}
  return origCols.size>1;
}

async function processTurn(r,c){
  if(G.animating)return;
  G.animating=true;

  const group=findGroup(r,c);
  if(group.length<MIN_GROUP){G.animating=false;return}

  let turnScore=0;
  let cascadeLevel=1;
  let tilesCleared=group.length;
  let cascadeGroupCount=0;
  let biggestGroup=group.length;

  const trackGrid=Array.from({length:G.rows},()=>Array(G.effectiveCols).fill(-1));
  for(let rr=0;rr<G.rows;rr++)for(let cc=0;cc<G.effectiveCols;cc++)if(G.grid[rr][cc])trackGrid[rr][cc]=cc;

  popCells(group);
  await sleep(250);
  group.forEach(([gr,gc])=>{G.grid[gr][gc]=0;trackGrid[gr][gc]=-1});
  const base=(group.length-MIN_GROUP+1)**2;
  turnScore+=base*cascadeLevel;
  showScorePop(r,c,base,cascadeLevel);

  let cascading=true;
  while(cascading){
    applyGravityTracked(trackGrid);
    collapseColumnsTracked(trackGrid);
    renderBoard();
    await sleep(200);

    const allGroups=findAllGroups(CASCADE_MIN_GROUP);
    const cascadeGroups=allGroups.filter(g=>isNewGroup(g,trackGrid));
    if(cascadeGroups.length===0){cascading=false;break}

    cascadeLevel++;
    showCascadeLabel(cascadeLevel);

    let cascadeScore=0;
    for(const g of cascadeGroups){
      tilesCleared+=g.length;
      cascadeGroupCount++;
      if(g.length>biggestGroup)biggestGroup=g.length;
      popCells(g);
      await sleep(200);
      g.forEach(([gr,gc])=>{G.grid[gr][gc]=0;trackGrid[gr][gc]=-1});
      const bs=(g.length-MIN_GROUP+1)**2;
      cascadeScore+=bs*cascadeLevel;
    }
    turnScore+=cascadeScore;
    await sleep(150);
  }

  const isClear=G.effectiveCols===0||G.grid.every(row=>row.every(c=>c===0));
  if(isClear){
    turnScore+=BOARD_CLEAR_BONUS;
    G.players[G.curP].clears++;
  }

  const p=G.players[G.curP];
  p.score+=turnScore;
  if(turnScore>p.maxTurn)p.maxTurn=turnScore;
  if(typeof recordTurn==='function')recordTurn({
    human:p.type==='human',
    groups:1,
    cascadeGroups:cascadeGroupCount,
    tiles:tilesCleared,
    cascadeSteps:Math.max(0,cascadeLevel-1),
    cascade:cascadeLevel,
    boardClear:isClear,
    groupSize:biggestGroup,
    score:turnScore
  });

  G.animating=false;
  renderAll();

  const hasMoves=findAllGroups().length>0;
  if(!hasMoves){
    setMsg(`🚫 ¡Sin movimientos! Fin de la ronda ${G.round}`);
    setTimeout(nextRound,2000);
    return;
  }

  G.curP=(G.curP+1)%G.players.length;
  startTurn();
}

function popCells(group){
  group.forEach(([r,c])=>{
    const el=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if(el)el.classList.add('popping');
  });
}

function showScorePop(r,c,pts,cascade){
  const el=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if(!el)return;
  const rect=el.getBoundingClientRect();
  const pop=document.createElement('div');
  pop.className='score-pop';
  pop.textContent=`+${pts}${cascade>1?' ×'+cascade:''}`;
  pop.style.left=rect.left+rect.width/2-20+'px';
  pop.style.top=rect.top-10+'px';
  pop.style.color=G.players[G.curP].color;
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),800);
}

function showCascadeLabel(level){
  const board=document.getElementById('board');
  const rect=board.getBoundingClientRect();
  const lbl=document.createElement('div');
  lbl.className='cascade-label';
  lbl.textContent=`¡CADENA ×${level}!`;
  lbl.style.left=rect.left+rect.width/2-60+'px';
  lbl.style.top=rect.top+rect.height/2-20+'px';
  document.body.appendChild(lbl);
  setTimeout(()=>lbl.remove(),600);
}

function startTurn(){
  const p=G.players[G.curP];
  const hasMoves=findAllGroups().length>0;
  if(!hasMoves){
    setMsg(`🚫 Sin movimientos. Fin de ronda ${G.round}`);
    setTimeout(nextRound,2000);
    return;
  }
  renderAll();
  setMsg(`🎯 ${p.name}: clicka un grupo de 2+ fichas del mismo color`);
  if(p.type!=='human')setTimeout(aiTurn,500);
}

function aiTurn(){
  const p=G.players[G.curP];
  const groups=findAllGroups();
  if(groups.length===0){G.curP=(G.curP+1)%G.players.length;startTurn();return}

  if(p.type==='easy'){
    groups.sort((a,b)=>b.length-a.length);
    const best=groups[0];
    processTurn(best[0][0],best[0][1]);
    return;
  }

  if(p.type==='medium'){
    let bestScore=-1,bestR=0,bestC=0;
    for(const g of groups){
      const sc=simulateTurn(g[0][0],g[0][1]);
      if(sc>bestScore){bestScore=sc;bestR=g[0][0];bestC=g[0][1]}
    }
    processTurn(bestR,bestC);
    return;
  }

  let bestVal=-Infinity,bestR=0,bestC=0;
  const scored=[];
  for(const g of groups){
    const sc=simulateTurn(g[0][0],g[0][1]);
    scored.push({r:g[0][0],c:g[0][1],score:sc});
  }
  scored.sort((a,b)=>b.score-a.score);
  const top=scored.slice(0,15);
  for(const move of top){
    const saved=saveGrid();
    const ownScore=simulateTurn(move.r,move.c);
    applySimTurn(move.r,move.c);
    const oppGroups=findAllGroups();
    let bestOpp=0;
    for(const og of oppGroups){
      const os=simulateTurn(og[0][0],og[0][1]);
      if(os>bestOpp)bestOpp=os;
    }
    const val=ownScore-0.5*bestOpp;
    restoreGrid(saved);
    if(val>bestVal){bestVal=val;bestR=move.r;bestC=move.c}
  }
  processTurn(bestR,bestC);
}

function simulateTurn(r,c){
  const saved=saveGrid();
  const group=findGroup(r,c);
  if(group.length<MIN_GROUP){restoreGrid(saved);return 0}

  const trackGrid=Array.from({length:G.rows},()=>Array(G.effectiveCols).fill(-1));
  for(let rr=0;rr<G.rows;rr++)for(let cc=0;cc<G.effectiveCols;cc++)if(G.grid[rr][cc])trackGrid[rr][cc]=cc;

  group.forEach(([gr,gc])=>{G.grid[gr][gc]=0;trackGrid[gr][gc]=-1});
  let score=(group.length-MIN_GROUP+1)**2;
  let level=1;
  let casc=true;
  while(casc){
    applyGravityTracked(trackGrid);collapseColumnsTracked(trackGrid);
    const ag=findAllGroups(CASCADE_MIN_GROUP).filter(g=>isNewGroup(g,trackGrid));
    if(!ag.length){casc=false;break}
    level++;
    for(const g of ag){
      g.forEach(([gr,gc])=>{G.grid[gr][gc]=0;trackGrid[gr][gc]=-1});
      score+=(g.length-MIN_GROUP+1)**2*level;
    }
  }
  restoreGrid(saved);
  return score;
}

function applySimTurn(r,c){
  const group=findGroup(r,c);
  if(group.length<MIN_GROUP)return;

  const trackGrid=Array.from({length:G.rows},()=>Array(G.effectiveCols).fill(-1));
  for(let rr=0;rr<G.rows;rr++)for(let cc=0;cc<G.effectiveCols;cc++)if(G.grid[rr][cc])trackGrid[rr][cc]=cc;

  group.forEach(([gr,gc])=>{G.grid[gr][gc]=0;trackGrid[gr][gc]=-1});
  let casc=true;
  while(casc){
    applyGravityTracked(trackGrid);collapseColumnsTracked(trackGrid);
    const ag=findAllGroups(CASCADE_MIN_GROUP).filter(g=>isNewGroup(g,trackGrid));
    if(!ag.length){casc=false;break}
    for(const g of ag)g.forEach(([gr,gc])=>{G.grid[gr][gc]=0;trackGrid[gr][gc]=-1});
  }
}

function saveGrid(){
  return{grid:G.grid.map(r=>[...r]),eff:G.effectiveCols}
}
function restoreGrid(s){
  G.grid=s.grid.map(r=>[...r]);G.effectiveCols=s.eff;
}

function renderAll(){
  renderBoard();
  renderPlayerBar();
  renderTurnBadge();
  document.getElementById('roundBadge').textContent=`Ronda ${G.round}/${G.maxRounds}`;
}

function renderBoard(){
  const board=document.getElementById('board');
  board.style.gridTemplateColumns=`repeat(${G.effectiveCols},32px)`;
  let html='';
  for(let r=0;r<G.rows;r++){
    for(let c=0;c<G.effectiveCols;c++){
      const v=G.grid[r][c];
      const bg=v?PALETTE[v-1]:'';
      const cls=v?'':'empty';
      html+=`<div class="cell ${cls}" data-r="${r}" data-c="${c}" style="${v?'background:'+bg:''}" onclick="cellClick(${r},${c})" onmouseenter="cellHover(${r},${c})" onmouseleave="clearHover()"></div>`;
    }
  }
  board.innerHTML=html;
}

function renderPlayerBar(){
  const bar=document.getElementById('playerBar');
  bar.innerHTML=G.players.map((p,i)=>{
    const isCur=i===G.curP&&!G.over;
    return`<div class="pb ${isCur?'current':''}" style="color:${p.color};border-color:${p.color};background:${isCur?p.color+'22':'transparent'}">${p.name}<span class="pb-score">${p.score}pts</span></div>`;
  }).join('');
}

function renderTurnBadge(){
  const p=G.players[G.curP];
  const tb=document.getElementById('turnBadge');
  tb.textContent=`Turno: ${p.name}`;
  tb.style.color=p.color;
  tb.style.background=p.color+'22';
  tb.style.border=`2px solid ${p.color}`;
}

let hoverGroup=null;
function cellHover(r,c){
  if(G.animating||G.over)return;
  const p=G.players[G.curP];
  if(p.type!=='human')return;
  clearHover();
  if(!G.grid[r][c])return;
  const g=findGroup(r,c);
  if(g.length<MIN_GROUP)return;
  hoverGroup=g;
  g.forEach(([gr,gc])=>{
    const el=document.querySelector(`.cell[data-r="${gr}"][data-c="${gc}"]`);
    if(el)el.classList.add('highlight');
  });
}
function clearHover(){
  if(hoverGroup){
    hoverGroup.forEach(([gr,gc])=>{
      const el=document.querySelector(`.cell[data-r="${gr}"][data-c="${gc}"]`);
      if(el)el.classList.remove('highlight');
    });
    hoverGroup=null;
  }
}
function cellClick(r,c){
  if(G.animating||G.over)return;
  const p=G.players[G.curP];
  if(p.type!=='human')return;
  if(!G.grid[r][c])return;
  const g=findGroup(r,c);
  if(g.length<MIN_GROUP)return;
  clearHover();
  processTurn(r,c);
}

function endGame(){
  G.over=true;showS('end');
  const sorted=[...G.players].sort((a,b)=>b.score!==a.score?b.score-a.score:b.clears-a.clears);
  if(typeof recordGame==='function')recordGame({
    best:sorted.length?sorted[0].score:0,
    total:G.players.reduce((sum,pl)=>sum+pl.score,0),
    humanWin:!!(sorted.length&&sorted[0].type==='human')
  });
  const medals=['🥇','🥈','🥉','4️⃣'];
  document.getElementById('endRank').innerHTML=sorted.map((p,i)=>`<div class="end-rank ${i===0?'w':''}"><span class="er-pos">${medals[i]}</span><span class="er-name" style="color:${p.color}">${p.name}</span><span class="er-score">${p.score} pts</span><div style="font-size:.7em;color:var(--dim)">Clears:${p.clears} Mejor turno:${p.maxTurn}</div></div>`).join('');
}

function showS(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function setMsg(m){document.getElementById('msg').textContent=m}
